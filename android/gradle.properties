# 这台机器只有 7.3G 内存，原来 Gradle 堆 4G + Kotlin 编译进程，直接把内存打满，
# swap 用到 4.6G —— 每次编译大量时间花在换页上（一个 release 要 2 分半）。
# 项目才 1.2 万行，2G 堆完全够；Kotlin 编译进程单独限 1G。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 增量构建/任务输出缓存：同一份代码重复打包直接命中缓存
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.java.installations.paths=/opt/jdk17
